# Build, test and deploy to Cloud Run on every push to main.
#
# Authentication is keyless. GitHub mints a short-lived OIDC token proving
# "this workflow is running in logixhunt24/iScale-Whatsapp-Chatbot", and
# Workload Identity Federation swaps it for GCP credentials. There is no
# service-account key in this repository, in GitHub secrets, or anywhere else
# - which is both safer and the only option, since the project blocks key
# downloads by org policy.
#
# Run .\setup-github-deploy.ps1 once before the first push.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

# Only one deploy at a time, and a newer push supersedes one still queued.
# Two concurrent deploys would race on the migration job.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  PROJECT_ID: iscale-chatbot-505710
  REGION: asia-south1
  SERVICE: iscale-bot
  JOB: iscale-migrate
  IMAGE: asia-south1-docker.pkg.dev/iscale-chatbot-505710/iscale/bot

jobs:
  # Gate the deploy on the suite. The bot answers real customers; shipping a
  # red build automatically is worse than not shipping automatically at all.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` is what lets the job mint the OIDC token. Without it
      # authentication fails with a message that does not mention this line.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/60075110318/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@iscale-chatbot-505710.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authorise Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # Tagged with the commit SHA, not a rolling version: rolling back is then
      # "deploy that tag" rather than "rebuild and hope".
      - name: Build and push
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # Migrations BEFORE the service. New code expects the new schema, and old
      # code tolerates columns it does not know about - so this order is the one
      # that survives the gap between the two steps. `alembic upgrade head` is a
      # no-op when nothing is new, so it runs unconditionally.
      - name: Run migrations
        run: |
          gcloud run jobs update $JOB --image=$IMAGE:${{ github.sha }} --region=$REGION
          gcloud run jobs execute $JOB --region=$REGION --wait

      # Only the image changes. Every environment variable, scaling flag and
      # Cloud SQL attachment already on the service is carried forward, so the
      # credentials in env.yaml never have to exist in CI.
      - name: Deploy
        run: gcloud run deploy $SERVICE --image=$IMAGE:${{ github.sha }} --region=$REGION

      - name: Verify it came up
        run: |
          URL=$(gcloud run services describe $SERVICE --region=$REGION --format='value(status.url)')
          echo "Deployed: $URL"
          curl -fsS --retry 5 --retry-delay 4 --retry-all-errors "$URL/api/v1/health"
          echo ""
          curl -fsS "$URL/api/v1/health/ready"
