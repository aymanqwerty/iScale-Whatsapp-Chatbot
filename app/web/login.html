<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>iScale Console</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0c10; --card:#12161d; --line:rgba(255,255,255,.07);
    --text:#e7ecf3; --muted:#8b96a5; --faint:#5c6673;
    --accent:#10b981; --accent-soft:rgba(16,185,129,.14);
    --err:#f87171;
    --r:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; display:grid; place-items:center; padding:24px;
    background:var(--bg); color:var(--text);
    font:400 15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* Two soft light sources so the flat panel reads as lit rather than painted. */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(680px 420px at 18% -8%, rgba(16,185,129,.10), transparent 60%),
      radial-gradient(560px 420px at 96% 108%, rgba(56,120,255,.09), transparent 60%);
  }
  .card{
    position:relative; width:min(392px,100%);
    background:linear-gradient(180deg,#161b23 0%, var(--card) 100%);
    border:1px solid var(--line); border-radius:20px; padding:38px 34px 30px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 70px -20px rgba(0,0,0,.85);
  }
  .mark{
    width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(145deg,#16d69a,#0b7f5f);
    color:#04231a;font-weight:800;font-size:19px;letter-spacing:-.02em;
    box-shadow:0 8px 22px -8px rgba(16,185,129,.75);
  }
  h1{margin:20px 0 5px;font-size:21px;font-weight:650;letter-spacing:-.02em;}
  .sub{margin:0 0 26px;color:var(--muted);font-size:13.5px;}

  label{display:block;font-size:11.5px;font-weight:600;color:var(--faint);
        letter-spacing:.07em;text-transform:uppercase;margin:0 0 7px;}
  .field{margin-bottom:16px;}
  input{
    width:100%;padding:12px 14px;border-radius:11px;
    border:1px solid var(--line); background:#0e1218; color:var(--text);
    font-size:15px; transition:border-color .16s, box-shadow .16s, background .16s;
  }
  input::placeholder{color:#4d5763;}
  input:hover{border-color:rgba(255,255,255,.13);}
  input:focus{outline:none;border-color:var(--accent);
              box-shadow:0 0 0 3.5px var(--accent-soft); background:#0f141b;}

  button{
    width:100%;margin-top:8px;padding:12.5px;border:0;border-radius:11px;
    background:linear-gradient(180deg,#14c98d,#0d9c6d); color:#04231a;
    font-size:15px;font-weight:650;cursor:pointer;letter-spacing:-.01em;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .1s ease, filter .16s, opacity .16s;
    box-shadow:0 10px 24px -12px rgba(16,185,129,.9);
  }
  button:hover:not(:disabled){filter:brightness(1.07);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{opacity:.75;cursor:progress;}

  .spin{width:15px;height:15px;border-radius:50%;
        border:2px solid rgba(4,35,26,.3);border-top-color:#04231a;
        animation:spin .6s linear infinite;display:none;}
  button.busy .spin{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .error{margin-top:14px;min-height:19px;font-size:13px;color:var(--err);
         display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .18s;}
  .error.show{opacity:1;}
  .foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
        color:var(--faint);font-size:12px;text-align:center;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main class="card">
  <div class="mark">iS</div>
  <h1>Console</h1>
  <p class="sub">Sign in to view and take over conversations.</p>

  <form id="f" novalidate>
    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="username" autocomplete="username" placeholder="iScale-user" required autofocus>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" required>
    </div>
    <button id="b" type="submit"><span class="spin"></span><span id="bt">Sign in</span></button>
    <div class="error" id="e" role="alert"></div>
  </form>

  <div class="foot">Internal use only · The iScale</div>
</main>

<script>
const f=document.getElementById('f'), b=document.getElementById('b'),
      bt=document.getElementById('bt'), e=document.getElementById('e');

function fail(msg){ e.textContent=msg; e.classList.add('show'); }

f.addEventListener('submit', async (ev)=>{
  ev.preventDefault();
  e.classList.remove('show');
  b.disabled=true; b.classList.add('busy'); bt.textContent='Signing in';
  try{
    const r=await fetch('/api/v1/console/api/login',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('u').value,
                           password:document.getElementById('p').value}),
    });
    if(r.ok){ bt.textContent='Welcome back'; location.href='/api/v1/console/app'; return; }
    const body=await r.json().catch(()=>({}));
    fail(body.detail || 'Sign in failed.');
  }catch{ fail('Could not reach the server.'); }
  b.disabled=false; b.classList.remove('busy'); bt.textContent='Sign in';
});
</script>
</body>
</html>
