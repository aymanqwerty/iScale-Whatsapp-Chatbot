<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>iScale Console</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0c10; --panel:#0e1218; --panel2:#12171f; --raised:#161c25;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.045);
    --text:#e7ecf3; --muted:#8b96a5; --faint:#5c6673;
    --accent:#10b981; --accent-soft:rgba(16,185,129,.14);
    --amber:#f0b232; --err:#f87171;
    --in:#171d26; --out:#0d5c46; --agent:#1d4ed8;
    --sidebar:352px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text); display:flex; overflow:hidden;
    font:400 15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px;
                            border:2px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===================== sidebar ===================== */
  aside{
    width:var(--sidebar); min-width:280px; flex-shrink:0;
    background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:15px 16px 14px;
         border-bottom:1px solid var(--line);}
  .mark{
    width:34px;height:34px;display:block;flex-shrink:0;
    filter:drop-shadow(0 5px 14px rgba(197,15,20,.42));
  }
  .brand .t{flex:1;min-width:0;}
  .brand .t b{display:block;font-size:14px;font-weight:650;letter-spacing:-.01em;}
  .brand .t span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;
       box-shadow:0 0 0 3px rgba(16,185,129,.16);transition:background .2s,box-shadow .2s;}
  .dot.off{background:var(--amber);box-shadow:0 0 0 3px rgba(240,178,50,.16);}
  .icon{
    width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;
    transition:background .15s,color .15s,border-color .15s;
  }
  .icon:hover{background:var(--raised);color:var(--text);border-color:rgba(255,255,255,.13);}
  .icon:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-soft);border-color:var(--accent);}
  /* Beside the handover button, so it matches its height rather than the 32px
     sidebar icons. Red only on hover: closing the pane is harmless, and a
     permanently red control reads as destructive. */
  .icon.close{width:38px;height:38px;border-radius:10px;}
  .icon.close:hover{background:rgba(248,113,113,.12);color:var(--err);
                    border-color:rgba(248,113,113,.35);}

  .searchwrap{padding:12px 12px 10px;position:relative;}
  .searchwrap svg{position:absolute;left:24px;top:50%;transform:translateY(-50%);
                  color:var(--faint);pointer-events:none;}
  #search{
    width:100%;padding:10px 12px 10px 36px;border-radius:10px;
    border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:14px;
    transition:border-color .16s,box-shadow .16s;
  }
  #search::placeholder{color:#4d5763;}
  #search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}

  #list{flex:1;overflow-y:auto;padding:0 8px 12px;}
  .row{
    display:flex;gap:11px;width:100%;padding:11px 10px;margin-bottom:2px;
    border:0;border-radius:11px;background:transparent;color:inherit;text-align:left;
    cursor:pointer;align-items:flex-start;transition:background .13s;
  }
  .row:hover{background:var(--panel2);}
  .row.active{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);}
  .av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
      font-size:13.5px;font-weight:650;color:#fff;letter-spacing:-.01em;}
  .rbody{flex:1;min-width:0;}
  .rtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
  .rname{font-size:14px;font-weight:600;letter-spacing:-.01em;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rtime{font-size:11px;color:var(--faint);white-space:nowrap;flex-shrink:0;}
  .rnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px;}
  .rprev{font-size:12.5px;color:var(--faint);margin-top:3px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{display:inline-flex;align-items:center;margin-left:6px;padding:1px 7px;
         border-radius:99px;background:rgba(240,178,50,.15);color:var(--amber);
         font-size:9.5px;font-weight:700;letter-spacing:.05em;vertical-align:middle;}
  .badge.stop{background:rgba(248,113,113,.16);color:var(--err);}
  /* Green, not amber: money arriving is good news and must not read as another
     warning next to BLOCKED. */
  .badge.pay{background:rgba(16,185,129,.16);color:var(--accent);}

  /* Hidden until hover, like WhatsApp's own; revealed on focus too so it is
     reachable by keyboard rather than mouse-only. */
  .row{position:relative;}
  .rowchev{position:absolute;top:8px;right:6px;width:24px;height:24px;
    display:grid;place-items:center;border:0;border-radius:7px;padding:0;
    background:var(--raised);color:var(--muted);cursor:pointer;opacity:0;
    pointer-events:none;transition:opacity .13s,color .13s,background .13s;}
  .row:hover .rowchev,.rowchev:focus-visible{opacity:1;pointer-events:auto;}
  .rowchev:hover{background:var(--line);color:var(--text);}
  .pinmark{display:inline-flex;color:var(--faint);margin-top:2px;}
  .row.pinned{background:rgba(255,255,255,.022);}

  /* Fixed, not absolute: #list is an overflow container and would clip a menu
     opened on the last row. */
  .rowmenu{position:fixed;z-index:60;min-width:172px;padding:5px;
    background:var(--raised);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 18px 44px -14px rgba(0,0,0,.8);}
  .rowmenu button{display:flex;align-items:center;gap:10px;width:100%;
    padding:9px 11px;border:0;border-radius:8px;background:transparent;
    color:var(--text);font-size:13.5px;text-align:left;cursor:pointer;}
  .rowmenu button:hover{background:var(--panel2);}

  .scrim{position:fixed;inset:0;z-index:70;display:grid;place-items:center;
    background:rgba(4,6,10,.6);padding:20px;}
  .dialog{width:min(400px,100%);padding:24px;border-radius:16px;
    background:linear-gradient(180deg,#161b23 0%,var(--panel) 100%);
    border:1px solid var(--line);box-shadow:0 30px 80px -20px rgba(0,0,0,.9);}
  .dialog h2{margin:0 0 6px;font-size:17px;font-weight:650;letter-spacing:-.02em;}
  .dialog .dsub{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.5;}
  .dialog input{width:100%;padding:11px 13px;border-radius:10px;font-size:14.5px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);}
  .dialog input:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3.5px var(--accent-soft);}
  .dialog .actions{display:flex;align-items:center;gap:8px;margin-top:18px;}
  .dialog .actions .gap{flex:1;}
  .dialog button{border:0;border-radius:9px;padding:9px 15px;font-size:13px;
    font-weight:600;cursor:pointer;}
  .dialog button.ghost{background:transparent;color:var(--muted);
    box-shadow:inset 0 0 0 1px var(--line);}
  .dialog button.ghost:hover{background:var(--panel2);color:var(--text);}
  .dialog button.primary{background:linear-gradient(180deg,#14c98d,#0d9c6d);
    color:#04231a;font-weight:650;}
  /* Dimmed, not hidden. A blocked contact still has to be findable to be
     unblocked, but it should not draw the eye like live work does. */
  .row.blocked .av,.row.blocked .rprev,.row.blocked .rnum{opacity:.45;}
  .row.blocked .rname{opacity:.7;}

  /* ===================== skeletons ===================== */
  .sk{background:linear-gradient(90deg,rgba(255,255,255,.045) 25%,
                                        rgba(255,255,255,.09) 37%,
                                        rgba(255,255,255,.045) 63%);
      background-size:400% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:6px;}
  @keyframes sh{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  .sk.circle{border-radius:50%;}
  .skrow{display:flex;gap:11px;padding:11px 10px;align-items:flex-start;}

  /* ===================== thread ===================== */
  main{flex:1;display:flex;flex-direction:column;min-width:0;}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;
         background:var(--panel);border-bottom:1px solid var(--line);min-height:65px;}
  header .hname{font-size:15px;font-weight:650;letter-spacing:-.01em;}
  header .hsub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px;}
  .spacer{flex:1;}
  .btn{border:0;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:650;
       cursor:pointer;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:7px;
       transition:transform .1s ease,filter .16s,opacity .16s;white-space:nowrap;}
  .btn:hover:not(:disabled){filter:brightness(1.08);}
  .btn:active:not(:disabled){transform:translateY(1px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  /* Busy is not disabled: the action is under way, so it keeps its colour. */
  .btn.busy{opacity:1;cursor:progress;filter:saturate(.85) brightness(.95);}
  .btn.take{background:linear-gradient(180deg,#f5bd47,#e0a11f);color:#3b2a00;}
  .btn.give{background:linear-gradient(180deg,#14c98d,#0d9c6d);color:#04231a;}
  /* Block is destructive, so it stays quiet until pointed at rather than
     competing with the handover button beside it. */
  .btn.block{min-width:112px;background:transparent;color:var(--muted);
    box-shadow:inset 0 0 0 1px var(--line);}
  .btn.block:hover:not(:disabled){background:rgba(248,113,113,.12);color:var(--err);
    box-shadow:inset 0 0 0 1px rgba(248,113,113,.4);filter:none;}
  .btn.block.on{background:linear-gradient(180deg,#f26d6d,#d63e3e);color:#2a0505;
    box-shadow:none;}
  .btn.block.on:hover:not(:disabled){background:linear-gradient(180deg,#f58585,#e04c4c);
    color:#2a0505;box-shadow:none;}

  #thread{flex:1;overflow-y:auto;padding:22px 20px 8px;display:flex;flex-direction:column;gap:3px;
          background:radial-gradient(760px 420px at 50% -12%,rgba(56,120,255,.045),transparent 62%),
                     var(--bg);
          scroll-behavior:smooth;}
  .msg{max-width:min(70%,600px);padding:9px 12px 7px;border-radius:14px;font-size:14.2px;
       line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;
       animation:pop .18s ease-out;box-shadow:0 1px 2px rgba(0,0,0,.28);}
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.99);}to{opacity:1;transform:none;}}
  .msg .meta{display:block;font-size:10px;color:rgba(255,255,255,.42);margin-top:4px;
             text-align:right;font-variant-numeric:tabular-nums;}
  .msg .who{display:block;font-size:9.5px;font-weight:700;letter-spacing:.06em;
            text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:3px;}
  .USER{align-self:flex-start;background:var(--in);border-bottom-left-radius:5px;}
  .BOT{align-self:flex-end;background:var(--out);border-bottom-right-radius:5px;}
  .AGENT{align-self:flex-end;background:var(--agent);border-bottom-right-radius:5px;}
  .SYSTEM{align-self:center;background:transparent;color:var(--faint);font-size:12px;
          font-style:italic;box-shadow:none;max-width:80%;text-align:center;}
  .msg.pending{opacity:.6;}
  .msg.failed{background:#5b1d1d;}
  .msg.failed .meta{color:#fca5a5;}
  .daysep{align-self:center;margin:12px 0 6px;padding:3px 12px;border-radius:99px;
          background:var(--panel2);color:var(--faint);font-size:11px;font-weight:600;
          box-shadow:inset 0 0 0 1px var(--line2);}

  footer{background:var(--panel);border-top:1px solid var(--line);padding:11px 20px 14px;}
  /* Sits between header and transcript so it cannot be scrolled past. */
  .paybar{display:flex;align-items:center;gap:12px;padding:11px 20px;
    background:rgba(16,185,129,.10);border-bottom:1px solid rgba(16,185,129,.22);
    font-size:13px;color:var(--text);}
  .paybar span{flex:1;min-width:0;}
  .paybar button{flex-shrink:0;border:0;border-radius:9px;padding:7px 13px;
    background:linear-gradient(180deg,#14c98d,#0d9c6d);color:#04231a;
    font-size:12.5px;font-weight:650;cursor:pointer;}
  .paybar button:hover{filter:brightness(1.08);}
  /* Payment screenshots. Capped so a tall phone screenshot cannot take over
     the pane - clicking opens the full size in a new tab. */
  .attach{display:block;margin:2px 0 7px;border-radius:10px;overflow:hidden;
    max-width:260px;line-height:0;}
  .attach img{display:block;width:100%;height:auto;max-height:340px;
    object-fit:cover;cursor:zoom-in;}
  .attach.failed{padding:10px 12px;background:rgba(255,255,255,.05);
    border-radius:10px;font-size:12px;color:var(--faint);line-height:normal;
    max-width:220px;}
  .note{font-size:12px;color:var(--muted);margin-bottom:9px;}
  .note.warn{color:var(--amber);}
  .composer{display:flex;gap:10px;align-items:flex-end;}
  #text{flex:1;padding:11px 15px;border-radius:14px;border:1px solid var(--line);
        background:var(--panel2);color:var(--text);font-size:14.2px;line-height:1.45;
        resize:none;max-height:132px;min-height:44px;
        transition:border-color .16s,box-shadow .16s,opacity .16s;}
  #text::placeholder{color:#4d5763;}
  #text:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft);}
  #text:disabled{opacity:.45;cursor:not-allowed;}
  #send{border-radius:14px;padding:0 18px;height:44px;}

  .empty{margin:auto;text-align:center;color:var(--faint);max-width:300px;}
  .empty .big{width:56px;height:56px;border-radius:16px;margin:0 auto 16px;
              display:grid;place-items:center;background:var(--panel2);
              box-shadow:inset 0 0 0 1px var(--line);}
  .empty h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:-.01em;}
  .empty p{margin:0;font-size:13px;line-height:1.5;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
         background:var(--raised);color:var(--text);padding:10px 16px;border-radius:11px;
         font-size:13px;box-shadow:0 16px 40px -12px rgba(0,0,0,.9),inset 0 0 0 1px var(--line);
         opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  .backbtn{display:none;}
  @media (max-width:820px){
    :root{--sidebar:100%;}
    aside{position:absolute;inset:0;z-index:20;}
    body.viewing aside{display:none;}
    .backbtn{display:grid;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <img class="mark" src="/logo.png" alt="" width="34" height="34">
    <div class="t">
      <b>The iScale</b>
      <span><i class="dot" id="dot"></i><span id="conn">Live</span></span>
    </div>
    <button class="icon" id="signout" type="button" title="Sign out" aria-label="Sign out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="searchwrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
    </svg>
    <input id="search" placeholder="Search name or number" autocomplete="off" spellcheck="false">
  </div>

  <div id="list"></div>
</aside>

<main>
  <header id="head" hidden>
    <button class="icon backbtn" id="back" type="button" aria-label="Back to list">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
    <div class="av" id="hAv"></div>
    <div>
      <div class="hname" id="hWho"></div>
      <div class="hsub" id="hSub"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn take" id="toggle" type="button"></button>
    <button class="btn block" id="blockBtn" type="button"></button>
    <!-- Closes the VIEW, not the conversation. Nothing is ended, no handover
         is undone and the customer sees nothing. -->
    <button class="icon close" id="close" type="button"
            title="Close this conversation (Esc)" aria-label="Close this conversation">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>

  <div id="thread">
    <div class="empty">
      <div class="big">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5c6673"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 20.5l1.6-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/>
        </svg>
      </div>
      <h3>No conversation selected</h3>
      <p>Pick a number on the left to read the thread and take it over.</p>
    </div>
  </div>

  <footer id="foot" hidden>
    <div class="note" id="note"></div>
    <div class="composer">
      <textarea id="text" rows="1" placeholder="Type a message" disabled></textarea>
      <button class="btn give" id="send" type="button" disabled>Send</button>
    </div>
  </footer>
</main>

<div class="rowmenu" id="rowmenu" role="menu" hidden></div>

<div class="scrim" id="scrim" hidden>
  <div class="dialog" role="dialog" aria-modal="true">
    <h2>Rename contact</h2>
    <p class="dsub" id="renameSub"></p>
    <form id="renameForm">
      <input id="renameInput" maxlength="120" spellcheck="false">
      <div class="actions">
        <button type="button" class="ghost" id="renameClear">Clear</button>
        <div class="gap"></div>
        <button type="button" class="ghost" id="renameCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '/api/v1/console/api';
// Captured before the first render so closing can restore the original
// placeholder rather than rebuilding it in JavaScript.
const EMPTY = document.querySelector('#thread .empty').cloneNode(true);
const $ = (id) => document.getElementById(id);

let current = null, paused = false, blocked = false, canReply = false;
let payment = false;
let convos = [], listLoaded = false;
let fetching = false, socket = null, retry = 1000, tempSeq = -1;

// Bumped on every handover. A poll already in flight when the button is pressed
// carries the OLD bot_paused, and applying it flipped the button back a moment
// after the click - then forward again on the next poll. Comparing this across
// the await lets a stale response be recognised and discarded.
let handoverSeq = 0, handoverBusy = false, handoverPending = false;

// Blocking is a second boolean with exactly the same race, so it gets its own
// copy of the same three guards rather than sharing them - a click on one button
// must not discard a response belonging to the other.
let blockSeq = 0, blockBusy = false, blockPending = false;

// Per-conversation cache. Re-opening a thread then paints instantly from memory
// while the delta fetch runs behind it, so the pane is never blank while the
// network works. Nothing about the transport changed - this is perceived speed.
const cache = new Map();   // phone -> {msgs, lastId, seen}

function state(phone) {
  if (!cache.has(phone)) cache.set(phone, { msgs: [], lastId: 0, seen: new Set() });
  return cache.get(phone);
}

async function api(path, options) {
  const r = await fetch(API + path, options);
  if (r.status === 401) { location.href = '/api/v1/console'; throw new Error('signed out'); }
  return r;
}

/* ---------------- formatting ---------------- */
function prettyPhone(p) {
  const d = String(p).replace(/[^0-9]/g, '');
  if (d.length === 12 && d.startsWith('91')) return '+91 ' + d.slice(2, 7) + ' ' + d.slice(7);
  return '+' + d;
}
function timeAgo(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short' });
}
function clock(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function dayLabel(iso) {
  const d = new Date(iso), today = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return 'Today';
  const y = new Date(today); y.setDate(today.getDate() - 1);
  if (same(d, y)) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'long' });
}
function initials(name, phone) {
  const n = (name || '').trim();
  if (n) {
    const parts = n.split(/\s+/);
    const first = parts[0][0] || '';
    const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
    return (first + last).toUpperCase();
  }
  return String(phone).replace(/[^0-9]/g, '').slice(-2);
}
// Deterministic colour per number: the same person keeps the same avatar across
// reloads, so staff start recognising threads without reading them.
function hue(phone) {
  let h = 0;
  for (const c of String(phone)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
}
function paintAvatar(el, name, phone) {
  el.textContent = initials(name, phone);
  const h = hue(phone);
  el.style.background =
    'linear-gradient(145deg,hsl(' + h + ' 55% 46%),hsl(' + ((h + 38) % 360) + ' 58% 34%))';
}

/* ---------------- skeletons ---------------- */
function listSkeleton(n) {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < (n || 7); i++) {
    const row = document.createElement('div'); row.className = 'skrow';
    const av = document.createElement('div'); av.className = 'sk circle';
    av.style.cssText = 'width:40px;height:40px;flex-shrink:0';
    const body = document.createElement('div'); body.style.flex = '1';
    const a = document.createElement('div'); a.className = 'sk';
    a.style.cssText = 'height:11px;width:' + (45 + Math.random() * 30) + '%';
    const b = document.createElement('div'); b.className = 'sk';
    b.style.cssText = 'height:9px;width:38%;margin-top:7px';
    const c = document.createElement('div'); c.className = 'sk';
    c.style.cssText = 'height:9px;width:' + (60 + Math.random() * 28) + '%;margin-top:7px';
    body.append(a, b, c); row.append(av, body); frag.appendChild(row);
  }
  return frag;
}
function threadSkeleton() {
  const frag = document.createDocumentFragment();
  [46, 62, 38, 70, 52].forEach((w, i) => {
    const b = document.createElement('div'); b.className = 'sk';
    b.style.cssText = 'height:' + (34 + (i % 2) * 16) + 'px;width:' + w + '%;' +
                      'border-radius:14px;margin-bottom:9px;align-self:' +
                      (i % 2 ? 'flex-end' : 'flex-start');
    frag.appendChild(b);
  });
  return frag;
}

/* ---------------- conversation list ---------------- */
// textContent throughout, never innerHTML with message data: a customer can put
// anything in a WhatsApp message, and this page is where staff read it.
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const list = $('list');
  const rows = convos.filter(
    (c) => !q || c.phone.includes(q) || (c.name || '').toLowerCase().includes(q)
  );
  list.replaceChildren();

  if (!rows.length) {
    const e = document.createElement('div');
    e.style.cssText = 'padding:34px 18px;text-align:center;color:var(--faint);font-size:13px';
    e.textContent = q ? 'No matches.' : 'No conversations yet.';
    list.appendChild(e);
    return;
  }

  rows.forEach((c) => {
    const row = document.createElement('button');
    row.className = 'row' + (c.phone === current ? ' active' : '') +
      (c.blocked ? ' blocked' : '') + (c.pinned ? ' pinned' : '');
    row.type = 'button';

    const av = document.createElement('div'); av.className = 'av';
    paintAvatar(av, c.name, c.phone);

    const body = document.createElement('div'); body.className = 'rbody';
    const top = document.createElement('div'); top.className = 'rtop';
    const name = document.createElement('span'); name.className = 'rname';
    name.textContent = c.name || 'Unknown';
    // Blocked and handed-over are both "the bot is quiet here", for opposite
    // reasons, so they must never wear the same badge.
    if (c.blocked) {
      const badge = document.createElement('span');
      badge.className = 'badge stop'; badge.textContent = 'BLOCKED';
      name.appendChild(badge);
    } else if (c.bot_paused) {
      const badge = document.createElement('span');
      badge.className = 'badge'; badge.textContent = 'YOU';
      name.appendChild(badge);
    }
    // Shown as well as the above, not instead of it: money waiting to be
    // checked outranks both.
    if (c.payment_pending) {
      const badge = document.createElement('span');
      badge.className = 'badge pay'; badge.textContent = 'PAYMENT';
      name.appendChild(badge);
    }
    const when = document.createElement('span'); when.className = 'rtime';
    when.textContent = timeAgo(c.last_activity);
    top.append(name, when);

    // Pinned rows sit out of recency order, so they say why - otherwise the
    // top of the list just looks stale.
    if (c.pinned) {
      const mark = document.createElement('span');
      mark.className = 'pinmark'; mark.title = 'Pinned to the top';
      mark.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"' +
        ' stroke="currentColor" stroke-width="2.2" stroke-linecap="round"' +
        ' stroke-linejoin="round"><path d="M12 17v5"/>' +
        '<path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2Z"/></svg>';
      body.appendChild(mark);
    }

    const num = document.createElement('div'); num.className = 'rnum';
    num.textContent = prettyPhone(c.phone);
    const prev = document.createElement('div'); prev.className = 'rprev';
    prev.textContent = (c.last_sender === 'USER' ? '' : '↩ ') + (c.last_message || '');

    body.append(top, num, prev);
    row.append(av, body);
    // Stops the click so opening the menu does not also open the thread.
    // Coordinates come from the chevron; the menu is fixed-positioned to
    // escape #list's overflow clipping.
    const chev = document.createElement('button');
    chev.type = 'button'; chev.className = 'rowchev';
    chev.setAttribute('aria-label', 'Options for ' + (c.name || c.phone));
    chev.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"' +
      ' stroke="currentColor" stroke-width="2.4" stroke-linecap="round"' +
      ' stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
    chev.addEventListener('click', (ev) => {
      ev.stopPropagation();
      openRowMenu(c, chev.getBoundingClientRect());
    });
    row.appendChild(chev);

    row.addEventListener('click', () => open(c.phone));
    list.appendChild(row);
  });
}

async function loadConversations() {
  if (!listLoaded) $('list').replaceChildren(listSkeleton());
  try {
    const r = await api('/conversations');
    convos = (await r.json()).conversations;
    listLoaded = true;
    renderList();
  } catch (err) {
    if (!listLoaded) $('list').replaceChildren();
  }
}

/* ---------------- thread ---------------- */
function bubble(m) {
  const el = document.createElement('div');
  el.className = 'msg ' + m.sender + (m.pending ? ' pending' : '') + (m.failed ? ' failed' : '');
  if (m.sender === 'AGENT') {
    const who = document.createElement('span');
    who.className = 'who'; who.textContent = 'You';
    el.appendChild(who);
  }
  // Fetched rather than set as an <img src>: the endpoint sits behind the
  // console session, and a browser will not send credentials on an image
  // request from a page hosted elsewhere. The object URL is released once the
  // picture has decoded, so redrawing the thread cannot leak copies of it.
  if (m.has_media) {
    const link = document.createElement('a');
    link.className = 'attach'; link.target = '_blank'; link.rel = 'noreferrer';
    el.appendChild(link);
    api('/media/' + m.id)
      .then((r) => (r.ok ? r.blob() : Promise.reject(new Error())))
      .then((blob) => {
        const url = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.alt = 'Attachment from the customer';
        img.onload = () => URL.revokeObjectURL(url);
        img.src = url;
        link.href = url;
        link.appendChild(img);
      })
      .catch(() => {
        link.className = 'attach failed';
        link.textContent = 'Attachment unavailable';
      });
  }
  el.appendChild(document.createTextNode(m.text));
  const meta = document.createElement('span'); meta.className = 'meta';
  meta.textContent = m.failed ? 'Not delivered' : (m.pending ? 'Sending…' : clock(m.at));
  el.appendChild(meta);
  return el;
}

function paintThread(phone) {
  const st = state(phone), thread = $('thread');
  thread.replaceChildren();
  let lastDay = '';
  st.msgs.forEach((m) => {
    const day = m.at ? dayLabel(m.at) : '';
    if (day && day !== lastDay) {
      lastDay = day;
      const sep = document.createElement('div');
      sep.className = 'daysep'; sep.textContent = day;
      thread.appendChild(sep);
    }
    thread.appendChild(bubble(m));
  });
  thread.scrollTop = thread.scrollHeight;
}

function absorb(phone, messages) {
  const st = state(phone);
  let added = 0;
  messages.forEach((m) => {
    if (st.seen.has(m.id)) return;   // drawn already - never draw it twice
    st.seen.add(m.id);
    st.msgs.push(m);
    st.lastId = Math.max(st.lastId, m.id);
    added++;
  });
  return added;
}

async function open(phone) {
  current = phone;
  document.body.classList.add('viewing');
  $('head').hidden = false;
  $('foot').hidden = false;
  renderList();

  const c = convos.find((x) => x.phone === phone);
  paintAvatar($('hAv'), c && c.name, phone);
  $('hWho').textContent = (c && c.name) || 'Unknown';
  $('hSub').textContent = prettyPhone(phone);
  if (c) {
    paused = !!c.bot_paused; blocked = !!c.blocked; payment = !!c.payment_pending;
    paintControls();
  }

  const st = state(phone);
  if (st.msgs.length) paintThread(phone);               // instant, from cache
  else $('thread').replaceChildren(threadSkeleton());   // first visit
  await refresh(true);
}

async function refresh(full) {
  if (!current) return;
  if (fetching && !full) return;
  fetching = true;
  const phone = current, st = state(phone);
  const seq = handoverSeq, bseq = blockSeq;
  try {
    const r = await api(
      '/messages/' + encodeURIComponent(phone) + '?after_id=' + (full ? 0 : st.lastId)
    );
    if (!r.ok) return;
    const d = await r.json();
    if (phone !== current) return;   // switched conversation mid-flight
    if (full) { st.msgs = []; st.seen = new Set(); st.lastId = 0; }
    const added = absorb(phone, d.messages);
    // Only trust this response's handover value if nothing changed it while the
    // request was in flight. Messages are always applied - they cannot be
    // stale, only incomplete.
    if (!handoverPending && handoverSeq === seq) paused = d.bot_paused;
    if (!blockPending && blockSeq === bseq) blocked = d.blocked;
    payment = !!d.payment_pending;
    canReply = d.can_reply;
    $('hWho').textContent = d.name || 'Unknown';
    $('hSub').textContent = prettyPhone(d.phone);
    if (full || added) paintThread(phone);
    paintControls();
  } finally {
    fetching = false;
  }
}

function paintControls() {
  const t = $('toggle');
  t.textContent = handoverBusy
    ? (paused ? 'Taking over…' : 'Handing back…')
    : (paused ? 'Hand back to bot' : 'Take over from bot');
  t.className = 'btn ' + (paused ? 'give' : 'take') + (handoverBusy ? ' busy' : '');
  t.disabled = handoverBusy;
  // Hidden rather than disabled while blocked: the handover has no meaning
  // there, and the server refuses it anyway.
  t.hidden = blocked;

  const b = $('blockBtn');
  b.textContent = blockBusy
    ? (blocked ? 'Blocking…' : 'Unblocking…')
    : (blocked ? 'Unblock' : 'Block');
  b.className = 'btn block' + (blocked ? ' on' : '') + (blockBusy ? ' busy' : '');
  b.disabled = blockBusy;
  b.title = blocked
    ? 'Let this contact reach us again'
    : 'Stop interacting with this contact entirely';

  $('paybar').hidden = !payment;

  const usable = paused && canReply && !blocked;
  $('send').disabled = !usable;
  $('text').disabled = !usable;

  const note = $('note');
  if (blocked) {
    note.className = 'note warn';
    note.textContent =
      'Blocked. Nothing this number sends reaches us, and nobody replies — unblock to resume.';
  } else if (!paused) {
    note.className = 'note';
    note.textContent = 'The bot is handling this conversation. Take it over to reply yourself.';
  } else if (!canReply) {
    note.className = 'note warn';
    note.textContent =
      'Outside the 24-hour window — WhatsApp will not deliver a reply until the customer messages again.';
  } else {
    note.className = 'note';
    note.textContent = 'You are replying. The bot stays silent until you hand it back.';
  }
}

/* ---------------- actions, applied optimistically ---------------- */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}

// Flip the UI first, confirm with the server after. This button used to wait on
// a POST plus two follow-up fetches before anything moved, which is what made it
// feel slow. A failure rolls the state back and says so.
$('toggle').addEventListener('click', async () => {
  // Locked while in flight: a second click queued a contrary request, and
  // whichever finished last won - so the button could settle on the opposite
  // of what was asked for.
  if (!current || handoverPending) return;
  const phone = current, want = !paused;
  const row = convos.find((c) => c.phone === phone);

  handoverPending = true;
  handoverSeq += 1;          // discard anything already in flight
  handoverBusy = true;
  paused = want; paintControls();
  if (row) { row.bot_paused = want; renderList(); }

  try {
    const r = await api('/handover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, paused: want }),
    });
    if (!r.ok) throw new Error();
    const saved = await r.json();
    // Bumped again before applying: a poll issued while the POST was in flight
    // is now stale, and this is the bump that stops it landing a moment later
    // and reverting the button.
    handoverSeq += 1;
    paused = saved.bot_paused; paintControls();
    if (row) { row.bot_paused = saved.bot_paused; renderList(); }
    if (paused && canReply) $('text').focus();
  } catch (err) {
    handoverSeq += 1;
    paused = !want; paintControls();
    if (row) { row.bot_paused = !want; renderList(); }
    toast('Could not change the handover. Try again.');
  } finally {
    handoverPending = false;
    handoverBusy = false;
    paintControls();
  }
});

// Same three guards as the handover button, for the same reason: the click and
// the background poll are two writers over one boolean, and without this the
// button flips back a moment after it is pressed.
$('blockBtn').addEventListener('click', async () => {
  if (!current || blockPending) return;
  const phone = current, want = !blocked;
  const row = convos.find((c) => c.phone === phone);

  // Confirmed only on the way in. Blocking silently drops everything the number
  // sends afterwards, which is not something to do on a misclick; unblocking is
  // harmless and asking twice would just be in the way.
  if (want && !confirm(
    'Block ' + ((row && row.name) || prettyPhone(phone)) + '?\n\n' +
    'The bot will stop replying and anything they send from now on is ignored ' +
    '— it will not appear here. The messages already in this thread are kept, ' +
    'and you can unblock them at any time.'
  )) return;

  blockPending = true;
  blockSeq += 1;
  blockBusy = true;
  blocked = want; paintControls();
  if (row) { row.blocked = want; renderList(); }

  try {
    const r = await api('/block', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, blocked: want }),
    });
    if (!r.ok) throw new Error();
    const saved = await r.json();
    blockSeq += 1;
    blocked = saved.blocked; paused = saved.bot_paused; paintControls();
    if (row) { row.blocked = saved.blocked; renderList(); }
    toast(want ? 'Contact blocked.' : 'Contact unblocked.');
  } catch (err) {
    blockSeq += 1;
    blocked = !want; paintControls();
    if (row) { row.blocked = !want; renderList(); }
    toast(want ? 'Could not block. Try again.' : 'Could not unblock. Try again.');
  } finally {
    blockPending = false;
    blockBusy = false;
    paintControls();
  }
});

// One-way, so no optimistic-toggle machinery: there is no opposite state for a
// poll to fight over.
$('payok').addEventListener('click', async () => {
  if (!current) return;
  const phone = current, row = convos.find((c) => c.phone === phone);
  payment = false; paintControls();
  if (row) { row.payment_pending = false; renderList(); }
  try {
    const r = await api('/payment-verified', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone }),
    });
    if (!r.ok) throw new Error();
  } catch (err) {
    payment = true; paintControls();
    if (row) { row.payment_pending = true; renderList(); }
    toast('Could not clear the payment flag. Try again.');
  }
});

/* ---------------- row menu: pin & rename ---------------- */
let menuFor = null;

function closeRowMenu() {
  menuFor = null;
  $('rowmenu').hidden = true;
}

function openRowMenu(c, box) {
  menuFor = c;
  const menu = $('rowmenu');
  menu.replaceChildren();

  const pin = document.createElement('button');
  pin.type = 'button'; pin.setAttribute('role', 'menuitem');
  pin.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"' +
    ' stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
    ' stroke-linejoin="round"><path d="M12 17v5"/>' +
    '<path d="M9 10.8V4h6v6.8l2 3.2H7l2-3.2Z"/></svg>';
  pin.appendChild(document.createTextNode(c.pinned ? 'Unpin' : 'Pin to top'));
  pin.addEventListener('click', () => togglePin(c));

  const ren = document.createElement('button');
  ren.type = 'button'; ren.setAttribute('role', 'menuitem');
  ren.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"' +
    ' stroke="currentColor" stroke-width="2" stroke-linecap="round"' +
    ' stroke-linejoin="round"><path d="M12 20h9"/>' +
    '<path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  ren.appendChild(document.createTextNode('Rename'));
  ren.addEventListener('click', () => { closeRowMenu(); openRename(c); });

  menu.append(pin, ren);
  menu.hidden = false;

  // Measured after it is visible - the height is not known until then, and the
  // flip is only needed when it would run off the bottom of the window.
  const m = 8, mb = menu.getBoundingClientRect();
  let left = box.left - 150, top = box.bottom + 6;
  if (left + mb.width > innerWidth - m) left = innerWidth - mb.width - m;
  if (top + mb.height > innerHeight - m) top = box.top - mb.height - 6;
  menu.style.left = Math.max(m, left) + 'px';
  menu.style.top = Math.max(m, top) + 'px';
}

// Any outside interaction closes it. Scroll matters especially: the menu is
// fixed while the row beneath it is not, so leaving it open through a scroll
// would leave it pointing at a different contact.
document.addEventListener('mousedown', (ev) => {
  if (!menuFor) return;
  if (!$('rowmenu').contains(ev.target)) closeRowMenu();
});
addEventListener('resize', closeRowMenu);
$('list').addEventListener('scroll', closeRowMenu);

async function togglePin(c) {
  const want = !c.pinned;
  closeRowMenu();
  c.pinned = want; renderList();
  try {
    const r = await api('/pin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: c.phone, pinned: want }),
    });
    if (!r.ok) throw new Error();
    // Re-fetch so the server's pinned-first ordering is applied, rather than
    // leaving the row where it was with a pin icon on it.
    loadConversations();
  } catch (err) {
    c.pinned = !want; renderList();
    toast('Could not change the pin. Try again.');
  }
}

/* ---------------- rename ---------------- */
let renameFor = null;

function openRename(c) {
  renameFor = c;
  $('renameSub').textContent =
    'Shown here in the console only - ' + prettyPhone(c.phone) +
    ' still sees their own name from the bot.';
  const input = $('renameInput');
  input.value = c.alias || '';
  input.placeholder = c.name || 'Name for this contact';
  $('renameClear').hidden = !c.alias;
  $('scrim').hidden = false;
  input.focus(); input.select();
}

function closeRename() { renameFor = null; $('scrim').hidden = true; }

$('renameCancel').addEventListener('click', closeRename);
$('scrim').addEventListener('mousedown', (ev) => {
  if (ev.target === $('scrim')) closeRename();
});
$('renameClear').addEventListener('click', () => saveRename(''));
$('renameForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  saveRename($('renameInput').value.trim());
});

async function saveRename(name) {
  const c = renameFor;
  if (!c) return;
  closeRename();
  try {
    const r = await api('/rename', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: c.phone, name: name }),
    });
    if (!r.ok) throw new Error();
    const saved = await r.json();
    c.name = saved.name; c.alias = saved.alias;
    renderList();
    if (current === c.phone) $('hWho').textContent = saved.name || 'Unknown';
    toast(name ? 'Contact renamed.' : 'Name reset.');
  } catch (err) {
    toast('Could not rename. Try again.');
  }
}

async function send() {
  const box = $('text'), text = box.value.trim();
  if (!text || !current) return;
  const phone = current, st = state(phone);

  // Draw it immediately, greyed out, then confirm. Waiting for the round trip
  // made the composer feel broken on a slow connection.
  const temp = {
    tempId: tempSeq--, sender: 'AGENT', text: text,
    at: new Date().toISOString(), pending: true,
  };
  st.msgs.push(temp);
  paintThread(phone);
  box.value = '';
  box.style.height = 'auto';

  try {
    const r = await api('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, text: text }),
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.detail || 'Could not send.');
    }
    const saved = await r.json();
    temp.pending = false;
    temp.id = saved.id;
    st.seen.add(saved.id);
    st.lastId = Math.max(st.lastId, saved.id);
    if (phone === current) paintThread(phone);
    loadConversations().catch(() => {});
  } catch (err) {
    temp.pending = false;
    temp.failed = true;
    if (phone === current) paintThread(phone);
    toast(err.message || 'Could not send.');
  }
}

$('send').addEventListener('click', send);
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('text').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 132) + 'px';
});
$('search').addEventListener('input', renderList);
function closeThread() {
  current = null;
  document.body.classList.remove('viewing');
  $('head').hidden = true;
  $('foot').hidden = true;
  $('thread').replaceChildren(EMPTY.cloneNode(true));
  renderList();
}

$('back').addEventListener('click', closeThread);
$('close').addEventListener('click', closeThread);

// Escape closes the pane, but not while someone is mid-sentence in the composer
// or the search box - there it should mean "clear this field".
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if (tag === 'textarea' || tag === 'input') return;
  if (current) closeThread();
});
$('signout').addEventListener('click', async () => {
  try { await api('/logout', { method: 'POST' }); } catch (err) { /* leaving anyway */ }
  location.href = '/api/v1/console';
});

/* ---------------- live updates ---------------- */
// The socket carries only a nudge ("this number has activity"), never message
// content - the delta still comes through the authenticated endpoint. Polling
// stays as a slower fallback, so a dropped socket costs latency, not a dead page.
function setConn(live) {
  $('dot').classList.toggle('off', !live);
  $('conn').textContent = live ? 'Live' : 'Reconnecting…';
}

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  try {
    socket = new WebSocket(scheme + '://' + location.host + API + '/stream');
  } catch (err) {
    return schedule();
  }
  socket.onopen = () => { retry = 1000; setConn(true); };
  socket.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (err) { return; }
    if (msg.type !== 'activity') return;          // keepalive ping
    if (msg.phone === current) refresh(false).catch(() => {});
    loadConversations().catch(() => {});
  };
  socket.onclose = () => { setConn(false); schedule(); };
  socket.onerror = () => { try { socket.close(); } catch (err) { /* already gone */ } };
}

function schedule() {
  socket = null;
  setTimeout(connect, retry);
  retry = Math.min(retry * 2, 30000);   // back off; do not hammer a sleeping instance
}

loadConversations();
connect();
setInterval(() => refresh(false).catch(() => {}), 4000);
setInterval(() => loadConversations().catch(() => {}), 20000);
setInterval(renderList, 60000);   // keep the relative timestamps honest
</script>
</body>
</html>
