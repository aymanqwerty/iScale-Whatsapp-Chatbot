<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iScale Console</title>
<style>
  :root { --bg:#111b21; --panel:#202c33; --panel2:#2a3942; --accent:#00a884;
          --text:#e9edef; --muted:#8696a0; --in:#202c33; --out:#005c4b; --agent:#0b4f6c;
          --warn:#f0b232; --err:#f15c6d; --line:#222d34; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); display:flex;
         font:15px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }

  /* ---- left: conversation list ---- */
  aside { width:340px; min-width:280px; border-right:1px solid var(--line);
          display:flex; flex-direction:column; background:var(--panel); }
  .brand { padding:14px 16px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; justify-content:space-between; gap:8px; }
  .brand strong { font-size:15px; }
  .brand button { background:none; border:0; color:var(--muted); cursor:pointer; font-size:13px; }
  .brand button:hover { color:var(--text); }
  #search { margin:10px; padding:9px 12px; border-radius:8px; border:1px solid var(--panel2);
            background:var(--panel2); color:var(--text); font-size:14px; }
  #search:focus { outline:2px solid var(--accent); outline-offset:1px; }
  #list { flex:1; overflow-y:auto; }
  .row { padding:11px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:block;
         width:100%; text-align:left; background:none; border-left:3px solid transparent; color:inherit; }
  .row:hover { background:#182229; }
  .row.active { background:#2a3942; border-left-color:var(--accent); }
  .row .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .row .who { font-weight:600; font-size:14px; }
  .row .num { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .row .when { color:var(--muted); font-size:11px; white-space:nowrap; }
  .row .prev { color:var(--muted); font-size:13px; margin-top:2px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pill { font-size:10px; padding:1px 7px; border-radius:99px; background:var(--warn);
          color:#3b2a00; font-weight:700; margin-left:6px; }

  /* ---- right: thread ---- */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; align-items:center; gap:12px; }
  header .who { font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  .btn { border:0; border-radius:8px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn.take { background:var(--warn); color:#3b2a00; }
  .btn.give { background:var(--accent); color:#04231a; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  #thread { flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:8px;
            background:#0b141a; }
  .msg { max-width:min(74%,620px); padding:8px 11px; border-radius:9px; font-size:14px;
         white-space:pre-wrap; word-wrap:break-word; }
  .msg .meta { display:block; font-size:10px; color:var(--muted); margin-top:4px; text-align:right; }
  .USER  { align-self:flex-start; background:var(--in); }
  .BOT   { align-self:flex-end;   background:var(--out); }
  .AGENT { align-self:flex-end;   background:var(--agent); }
  .SYSTEM{ align-self:center; background:transparent; color:var(--muted); font-size:12px; font-style:italic; }
  .tag { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
         display:block; margin-bottom:2px; }

  footer { border-top:1px solid var(--line); background:var(--panel); padding:12px 16px; }
  .composer { display:flex; gap:10px; }
  #text { flex:1; padding:11px 14px; border-radius:20px; border:1px solid var(--panel2);
          background:var(--panel2); color:var(--text); font-size:14px; resize:none; max-height:120px; }
  #text:focus { outline:2px solid var(--accent); outline-offset:1px; }
  #send { border-radius:20px; padding:0 22px; }
  .note { color:var(--muted); font-size:12px; padding:2px 2px 8px; }
  .note.bad { color:var(--warn); }
  .empty { margin:auto; color:var(--muted); text-align:center; }
</style>
</head>
<body>

<aside>
  <div class="brand">
    <strong>Conversations</strong>
    <button id="signout" type="button">Sign out</button>
  </div>
  <input id="search" placeholder="Search number or name" autocomplete="off">
  <div id="list"></div>
</aside>

<main>
  <header id="head" hidden>
    <div>
      <div class="who" id="hWho"></div>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="spacer"></div>
    <button class="btn take" id="toggle" type="button"></button>
  </header>

  <div id="thread"><div class="empty">Select a conversation</div></div>

  <footer id="foot" hidden>
    <div class="note" id="note"></div>
    <div class="composer">
      <textarea id="text" rows="1" placeholder="Type a message"></textarea>
      <button class="btn give" id="send" type="button">Send</button>
    </div>
  </footer>
</main>

<script>
const API = '/api/v1/console/api';
let current = null;       // phone in view
let lastId = 0;           // highest message id rendered, for incremental fetching
let paused = false;
let canReply = false;
let convos = [];

// Every message id already on screen. This is the guarantee that a message can
// never be drawn twice: two overlapping responses can carry the same rows, and
// checking the id at render time makes duplication structurally impossible
// rather than merely unlikely.
let seen = new Set();

// Only one fetch in flight at a time. The original bug: a poll every 2s against
// a server taking longer than 2s meant the second request left with the same
// `after_id` as the first, so both returned the same messages and both appended
// them. The slower the server, the more copies.
let fetching = false;

const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const r = await fetch(API + path, options);
  if (r.status === 401) { location.href = '/api/v1/console'; throw new Error('signed out'); }
  return r;
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

function prettyPhone(p) {
  const d = String(p).replace(/\D/g, '');
  if (d.length === 12 && d.startsWith('91')) return `+91 ${d.slice(2, 7)} ${d.slice(7)}`;
  return '+' + d;
}

function clock(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// textContent everywhere, never innerHTML with message data: a customer can put
// anything in a WhatsApp message, and this page is where staff read it.
function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const list = $('list');
  list.replaceChildren();
  convos
    .filter(c => !q || c.phone.includes(q) || (c.name || '').toLowerCase().includes(q))
    .forEach(c => {
      const row = document.createElement('button');
      row.className = 'row' + (c.phone === current ? ' active' : '');
      row.type = 'button';

      const top = document.createElement('div'); top.className = 'top';
      const who = document.createElement('span'); who.className = 'who';
      who.textContent = c.name || 'Unknown';
      if (c.bot_paused) {
        const pill = document.createElement('span');
        pill.className = 'pill'; pill.textContent = 'YOU';
        who.appendChild(pill);
      }
      const when = document.createElement('span');
      when.className = 'when'; when.textContent = timeAgo(c.last_activity);
      top.append(who, when);

      // Name and number both: staff recognise regulars by name, but the number
      // is what they cross-check against the leads sheet.
      const num = document.createElement('div'); num.className = 'num';
      num.textContent = prettyPhone(c.phone);

      const prev = document.createElement('div'); prev.className = 'prev';
      prev.textContent = (c.last_sender === 'USER' ? '' : '↩ ') + (c.last_message || '');

      row.append(top, num, prev);
      row.addEventListener('click', () => open(c.phone));
      list.appendChild(row);
    });
}

async function loadConversations() {
  const r = await api('/conversations');
  convos = (await r.json()).conversations;
  renderList();
}

function renderMessages(messages, replace) {
  const thread = $('thread');
  if (replace) { thread.replaceChildren(); seen = new Set(); }
  let added = 0;
  messages.forEach(m => {
    if (seen.has(m.id)) return;   // already drawn - never draw it again
    seen.add(m.id);
    added++;
    const el = document.createElement('div');
    el.className = 'msg ' + m.sender;
    if (m.sender === 'AGENT') {
      const tag = document.createElement('span');
      tag.className = 'tag'; tag.textContent = 'You';
      el.appendChild(tag);
    }
    el.appendChild(document.createTextNode(m.text));
    const meta = document.createElement('span');
    meta.className = 'meta'; meta.textContent = clock(m.at);
    el.appendChild(meta);
    thread.appendChild(el);
    lastId = Math.max(lastId, m.id);
  });
  if (added) thread.scrollTop = thread.scrollHeight;
}

function paintControls() {
  $('toggle').textContent = paused ? 'Hand back to bot' : 'Take over from bot';
  $('toggle').className = 'btn ' + (paused ? 'give' : 'take');
  $('send').disabled = !paused || !canReply;
  $('text').disabled = !paused || !canReply;
  const note = $('note');
  if (!paused) {
    note.className = 'note';
    note.textContent = 'The bot is handling this conversation. Take it over to reply yourself.';
  } else if (!canReply) {
    note.className = 'note bad';
    note.textContent = 'Outside the 24-hour window — WhatsApp will not deliver a free-text reply until the customer messages again.';
  } else {
    note.className = 'note';
    note.textContent = 'You are replying. The bot stays silent until you hand it back.';
  }
}

async function open(phone) {
  current = phone; lastId = 0;
  $('head').hidden = false; $('foot').hidden = false;
  $('thread').replaceChildren();
  await poll(true);
  renderList();
}

async function poll(replace) {
  if (!current) return;
  if (fetching && !replace) return;   // a request is already on its way
  fetching = true;
  const phone = current;
  try {
    const r = await api(`/messages/${encodeURIComponent(phone)}?after_id=${replace ? 0 : lastId}`);
    if (!r.ok) return;
    const d = await r.json();
    // The user may have clicked another conversation while this was in flight.
    if (phone !== current) return;
    paused = d.bot_paused; canReply = d.can_reply;
    $('hWho').textContent = d.name || 'Unknown';
    $('hSub').textContent = prettyPhone(d.phone);
    renderMessages(d.messages, replace);
    paintControls();
  } finally {
    fetching = false;
  }
}

$('toggle').addEventListener('click', async () => {
  if (!current) return;
  $('toggle').disabled = true;
  await api('/handover', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: current, paused: !paused }),
  });
  $('toggle').disabled = false;
  await poll(false);
  await loadConversations();
});

async function send() {
  const text = $('text').value.trim();
  if (!text || !current) return;
  $('send').disabled = true;
  const r = await api('/send', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: current, text }),
  });
  if (r.ok) {
    $('text').value = '';
    await poll(false);
  } else {
    const body = await r.json().catch(() => ({}));
    const note = $('note');
    note.className = 'note bad';
    note.textContent = body.detail || 'Could not send.';
  }
  $('send').disabled = false;
}

$('send').addEventListener('click', send);
$('text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('search').addEventListener('input', renderList);
$('signout').addEventListener('click', async () => {
  await api('/logout', { method: 'POST' });
  location.href = '/api/v1/console';
});

// ---- live updates -------------------------------------------------------
// A WebSocket carries only a nudge ("this number has activity"), never message
// content - the delta still comes through the authenticated endpoint, so the
// socket can never become a second way to read customer data.
//
// Polling stays as a fallback at a slower cadence. A dropped socket then costs
// a few seconds of latency instead of a dead page, which matters on a free
// instance that sleeps.
let socket = null;
let retry = 1000;

function connect() {
  const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
  try {
    socket = new WebSocket(`${scheme}://${location.host}${API}/stream`);
  } catch { return schedule(); }

  socket.onopen = () => { retry = 1000; };
  socket.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type !== 'activity') return;          // ping keepalive
    if (msg.phone === current) poll(false).catch(() => {});
    loadConversations().catch(() => {});
  };
  socket.onclose = schedule;
  socket.onerror = () => { try { socket.close(); } catch {} };
}

function schedule() {
  socket = null;
  setTimeout(connect, retry);
  retry = Math.min(retry * 2, 30000);   // back off, do not hammer a sleeping instance
}

loadConversations();
connect();
setInterval(() => poll(false).catch(() => {}), 4000);
setInterval(() => loadConversations().catch(() => {}), 20000);
</script>
</body>
</html>
